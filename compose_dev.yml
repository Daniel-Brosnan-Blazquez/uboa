services:
  uboa_db:
    image: postgis/postgis:16-3.5
    container_name: uboa_db
    # Dedicated development database; application roles connect without passwords.
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    shm_size: 512M
    command: -c max_connections=100 -c max_locks_per_transaction=128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - boa_network

  uboa:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID_HOST_USER: ${UID_HOST_USER:-1000}
        GID_HOST_USER: ${GID_HOST_USER:-1000}
    container_name: uboa
    depends_on:
      uboa_db:
        condition: service_healthy
    hostname: uboa
    environment:
      UBOA_DDBB_HOST: uboa_db
      UBOA_RESOURCES_PATH: /resources_path
    volumes:
      - .:/uboa:rw
    shm_size: 512M
    networks:
      - boa_network

networks:
  boa_network:
    name: boa_network
