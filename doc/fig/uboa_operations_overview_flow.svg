     height="110"
     rx="12"
     id="rect7" />
  <text
     class="node-title"
     x="255"
     y="228"
     id="text8">Initialize the database</text>
  <text
     class="small"
     x="255"
     y="254"
     id="text9">uboa_init.py</text>
  <rect
     class="box blue"
     x="550"
     y="178"
     width="420"
     height="110"
     rx="12"
     id="rect10" />
  <text
     class="node-title"
     x="760"
     y="214"
     id="text11">Reset and load the SQL model</text>
  <text
     class="small"
     x="760"
     y="240"
     id="text12">uboa_init_ddbb.sh via psql</text>
  <text
     class="small"
     x="760"
     y="266"
     id="text13">bundled model or an explicit path</text>
  <rect
     class="box blue"
     x="70"
     y="368"
     width="370"
     height="120"
     rx="12"
     id="rect13" />
  <text
     class="node-title"
     x="255"
     y="409"
     id="text14">Load users configuration</text>
  <text
     class="small"
     x="255"
     y="435"
     id="text15">users.json or a custom JSON file</text>
  <text
     class="small"
     x="255"
     y="461"
     id="text16">Engine.insert_configuration()</text>
  <rect
     class="box amber"
     x="550"
     y="368"
     width="420"
     height="120"
     rx="12"
     id="rect16" />
  <text
     class="node-title"
     x="760"
     y="409"
     id="text17">Validate and apply operations</text>
  <text
     class="small"
     x="760"
     y="435"
     id="text18">insert / erase_and_insert / force_insert</text>
  <text
     class="small"
     x="760"
     y="461"
     id="text19">roles first, then users and role links</text>
  <rect
     class="box blue"
     x="70"
     y="568"
     width="370"
     height="110"
     rx="12"
     id="rect19" />
  <text
     class="node-title"
     x="255"
     y="604"
     id="text20">Read or delete users and roles</text>
  <text
     class="small"
     x="255"
     y="630"
     id="text21">application requests</text>
  <text
     class="small"
     x="255"
     y="656"
     id="text22">Query API</text>
  <rect
     class="box blue"
     x="550"
     y="568"
     width="420"
     height="110"
     rx="12"
     id="rect22" />
  <text
     class="node-title"
     x="760"
     y="604"
     id="text23">Build and execute a query</text>
  <text
     class="small"
     x="760"
     y="630"
     id="text24">get_users() / get_roles()</text>
  <text
     class="small"
     x="760"
     y="656"
     id="text25">validated filters, ordering and pagination</text>
  <rect
     class="box green"
     x="1090"
     y="178"
     width="350"
     height="500"
     rx="12"
     id="rect25" />
  <text
     class="node-title"
     x="1265"
     y="344"
     id="text26">PostgreSQL: uboadb</text>
  <text
     class="small"
     x="1265"
     y="370"
     id="text27">Core user-management tables</text>
  <text
     class="small"
     x="1265"
     y="396"
     id="text28">users: identity and account state</text>
  <text
     class="small"
     x="1265"
     y="422"
     id="text29">roles: names and descriptions</text>
  <text
     class="small"
     x="1265"
     y="448"
     id="text30">roles_users: user-to-role links</text>
  <text
     class="small"
     x="1265"
     y="506"
     id="text31" />
  <text
     class="small"
     x="1265"
     y="500"
     id="text32">SQLAlchemy persists and queries</text>
  <text
     class="small"
     x="1265"
     y="526"
     id="text33">the user-management records.</text>
  <rect
     class="box gray"
     x="70"
     y="758"
     width="370"
     height="120"
     rx="12"
     id="rect33" />
  <text
     class="node-title"
     x="255"
     y="799"
     id="text34">Component configuration</text>
  <text
     class="small"
     x="255"
     y="825"
     id="text35">UBOA_RESOURCES_PATH</text>
  <text
     class="small"
     x="255"
     y="851"
     id="text36">database, engine and users JSON</text>
  <rect
     class="box gray"
     x="550"
     y="758"
     width="420"
     height="120"
     rx="12"
     id="rect36" />
  <text
     class="node-title"
     x="760"
     y="799"
     id="text37">Operation results and logging</text>
  <text
     class="small"
     x="760"
     y="825"
     id="text38">one status per processed operation</text>
  <text
     class="small"
     x="760"
     y="851"
     id="text39">UBOA_LOG_PATH / uboa_engine.log</text>
  <rect
     class="box gray"
     x="1090"
     y="758"
     width="350"
     height="120"
     rx="12"
     id="rect39" />
  <text
     class="node-title"
     x="1265"
     y="799"
     id="text40">Flask-Security integration</text>
  <text
     class="small"
     x="1265"
     y="825"
     id="text41">UserMixin and RoleMixin</text>
  <text
     class="small"
     x="1265"
     y="851"
     id="text42">application authentication support</text>
