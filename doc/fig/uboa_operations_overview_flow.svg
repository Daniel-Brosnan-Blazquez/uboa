     height="800"
     rx="16"
     id="rect5" />
  <text
     class="section"
     x="534"
     y="142"
     text-anchor="start"
     id="text6">INITIALIZATION AND ENGINE API</text>
  <rect
     class="lane"
     x="1050"
     y="108"
     width="430"
     height="800"
     rx="16"
     id="rect6" />
  <text
     class="section"
     x="1074"
     y="142"
     text-anchor="start"
     id="text7">PERSISTENCE AND APPLICATIONS</text>
  <rect
