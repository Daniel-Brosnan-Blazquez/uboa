[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uboa"
version = "1.0.7"
description = "Users management for Business Operation Analysis"
readme = "README.md"
requires-python = ">=3.9,<3.12"
license = "MIT"
license-files = ["LICENSE", "AUTHORS"]
authors = [{name = "Daniel Brosnan", email = "d.brosnan.b@gmail.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Topic :: Database",
]
dependencies = [
    "sqlalchemy==1.3.22",
    "psycopg2-binary==2.9.11",
    "flask-security-too==4.1.6",
    # Flask-Security 4 uses pkg_resources, removed in setuptools 81.
    "setuptools>=77.0.3,<81",
    "Flask==2.2.5",
    "Werkzeug==3.0.6",
]

[project.optional-dependencies]
tests = ["pytest>=7,<9", "before_after==1.0.1", "pytest-cov==7.0.0"]

[project.urls]
Homepage = "https://github.com/danielbrosnan/uboa"
Repository = "https://github.com/danielbrosnan/uboa"
Issues = "https://github.com/danielbrosnan/uboa/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false
script-files = [
    "src/uboa/scripts/uboa_init.py",
    "src/uboa/scripts/uboa_init_ddbb.sh",
    "src/uboa/scripts/initialize_uboa_ddbb.sh",
    "src/uboa/scripts/start_uboa.sh",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["uboa", "uboa.*"]
exclude = ["*.tests", "*.tests.*"]
namespaces = false

[tool.setuptools.package-data]
uboa = ["config/*.json"]
"uboa.datamodel" = ["*.sql", "*.dbm"]
"uboa.scripts" = ["*.sh"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
markers = ["integration: requires a dedicated PostgreSQL database"]

[tool.coverage.run]
source = ["uboa"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = "src/tests/tmp/code_coverage_analysis"
